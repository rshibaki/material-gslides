<h1>material-gslides</h1>
<p>material-gslides は、個人が自分のパソコンで使うスライド作成ツールです。手元で作った HTML のスライドを、利用者本人の Google ドライブに Google スライドとして作成します。</p>
<p>Google アカウントへのアクセスは、このツールが作成したファイルだけに限られます（<code>drive.file</code> スコープ）。</p>
